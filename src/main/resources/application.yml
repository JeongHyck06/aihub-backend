spring:
  application:
    name: backend

  profiles:
    active: local # 기본 프로필
  datasource:
    url: ${AIHUB_DB_URL}
    username: ${AIHUB_DB_USERNAME}
    password: ${AIHUB_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: never

server:
  port: ${PORT:8080}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

aihub:
  jwt:
    secret: ${AIHUB_JWT_SECRET}
    access-token-validity-seconds: ${AIHUB_JWT_ACCESS_SECONDS:900}
    refresh-token-validity-seconds: ${AIHUB_JWT_REFRESH_SECONDS:1209600}
  cors:
    allowed-origins: ${AIHUB_CORS_ALLOWED_ORIGINS}
  oauth:
    providers:
      google:
        client-id: ${AIHUB_GOOGLE_CLIENT_ID}
        client-secret: ${AIHUB_GOOGLE_CLIENT_SECRET}
        token-uri: https://oauth2.googleapis.com/token
        issuer-uri: https://accounts.google.com
        user-info-uri: https://openidconnect.googleapis.com/v1/userinfo
      kakao:
        client-id: ${AIHUB_KAKAO_CLIENT_ID}
        client-secret: ${AIHUB_KAKAO_CLIENT_SECRET}
        token-uri: https://kauth.kakao.com/oauth/token
        issuer-uri: https://kauth.kakao.com
        user-info-uri: https://kapi.kakao.com/v1/oidc/userinfo
      github:
        client-id: ${AIHUB_GITHUB_CLIENT_ID}
        client-secret: ${AIHUB_GITHUB_CLIENT_SECRET}
        token-uri: https://github.com/login/oauth/access_token
        user-info-uri: https://api.github.com/user
        email-uri: https://api.github.com/user/emails
